<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sophia视频 - 随机推荐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* 顶部导航 */
        .nav-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .nav-item {
            color: rgba(255,255,255,0.6);
            padding: 6px 15px;
            font-size: 15px;
            white-space: nowrap;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
            user-select: none;
        }

        .nav-item.active {
            color: #fff;
            font-weight: bold;
            font-size: 17px;
        }

        .nav-item.active::after {
            content: '';
            display: block;
            width: 20px;
            height: 3px;
            background: #ff453a;
            border-radius: 2px;
            margin: 4px auto 0;
        }

        /* 视频容器 */
        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* 右侧按钮 */
        .sidebar {
            position: absolute;
            right: 10px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .action-btn {
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 24px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            user-select: none;
        }
        .action-btn:active { background: rgba(255,255,255,0.2); }
        .action-btn.favorited { color: #ffd700; background: rgba(255, 215, 0, 0.2); border-color: #ffd700; }

        /* 提示框 */
        #toast {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 200;
            text-align: center;
            font-size: 14px;
            max-width: 70%;
        }
        #toast.show { opacity: 1; }

        /* 收藏空状态 */
        .empty-fav {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            text-align: center;
            z-index: 50;
            font-size: 14px;
            display: none;
        }
        .empty-fav.show { display: block; }
        .empty-fav .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('recommend', this)">推荐</div>
    <div class="nav-item" onclick="switchTab('favorite', this)">收藏</div>
</div>

<div id="player-container">
    <video id="video-player" playsinline webkit-playsinline loop muted autoplay></video>

    <!-- 空收藏提示 -->
    <div class="empty-fav" id="empty-fav">
        <div class="icon">☆</div>
        <div>还没有收藏哦</div>
        <div style="font-size:12px;margin-top:6px;opacity:0.7;">点击右侧 ★ 按钮收藏视频</div>
    </div>

    <!-- 右侧按钮 -->
    <div class="sidebar">
        <div class="action-btn" id="fav-btn" onclick="toggleFavorite()">★</div>
        <div class="action-btn" onclick="nextVideo()">→</div>
    </div>

    <div id="toast"></div>
</div>

<script>
    // 三个视频源，轮询使用防止卡顿
    const API_SOURCES = [
        'https://www.cunshao.com/666666/api/pc.php',
        'https://www.cunshao.com/666666/api/web.php',
        'https://api.suyanw.cn/api/jksp.php'
    ];

    const video = document.getElementById('video-player');
    const toast = document.getElementById('toast');
    const favBtn = document.getElementById('fav-btn');
    const emptyFav = document.getElementById('empty-fav');

    let currentTab = 'recommend';
    let currentUrl = '';
    let currentSourceIndex = 0;
    let videoHistory = [];
    let historyIndex = -1;
    let favorites = [];
    let favIndex = 0;
    let loadRetryCount = 0;

    // 从本地存储加载收藏
    try {
        const saved = localStorage.getItem('sophia_favorites');
        if (saved) favorites = JSON.parse(saved);
    } catch (e) {}

    function saveFavorites() {
        try {
            localStorage.setItem('sophia_favorites', JSON.stringify(favorites));
        } catch (e) {}
    }

    // 1. 切换标签
    function switchTab(tab, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        currentTab = tab;
        videoHistory = [];
        historyIndex = -1;

        if (tab === 'favorite') {
            if (favorites.length === 0) {
                video.pause();
                video.src = '';
                emptyFav.classList.add('show');
            } else {
                emptyFav.classList.remove('show');
                favIndex = Math.floor(Math.random() * favorites.length);
                loadFavoriteVideo();
            }
        } else {
            emptyFav.classList.remove('show');
            loadVideo();
        }
    }

    // 获取下一个 API 源
    function getNextSource() {
        const url = API_SOURCES[currentSourceIndex];
        currentSourceIndex = (currentSourceIndex + 1) % API_SOURCES.length;
        return url;
    }

    // 2. 加载推荐视频（直接用 video.src，绕过 CORS）
    function loadVideo() {
        showToast("正在加载...");

        const sourceUrl = getNextSource();
        const url = `${sourceUrl}?t=${new Date().getTime()}_${Math.random()}`;
        currentUrl = url;

        video.src = url;
        video.load();

        updateFavButton();

        video.onloadeddata = function() {
            loadRetryCount = 0;
            video.play().catch(() => {
                showToast("点击屏幕播放");
            });
        };

        video.onerror = function() {
            // 失败了自动试下一个源
            if (loadRetryCount < API_SOURCES.length - 1) {
                loadRetryCount++;
                loadVideo();
            } else {
                loadRetryCount = 0;
                showToast("加载失败，上滑重试");
            }
        };
    }

    // 加载收藏视频
    function loadFavoriteVideo() {
        if (favorites.length === 0) {
            emptyFav.classList.add('show');
            return;
        }

        showToast("正在加载...");

        const url = favorites[favIndex];
        currentUrl = url;

        video.src = url;
        video.load();

        updateFavButton();

        video.onloadeddata = function() {
            video.play().catch(() => {
                showToast("点击屏幕播放");
            });
        };

        video.onerror = function() {
            showToast("加载失败");
        };
    }

    // 3. 下一个视频 (上滑)
    function nextVideo() {
        if (currentTab === 'favorite') {
            if (favorites.length === 0) return;
            favIndex = (favIndex + 1) % favorites.length;
            loadFavoriteVideo();
            return;
        }

        historyIndex++;
        videoHistory.push(currentUrl);
        if (videoHistory.length > 20) { videoHistory.shift(); historyIndex--; }
        loadVideo();
    }

    // 4. 上一个视频 (下滑)
    function prevVideo() {
        if (currentTab === 'favorite') {
            if (favorites.length === 0) return;
            favIndex = (favIndex - 1 + favorites.length) % favorites.length;
            loadFavoriteVideo();
            return;
        }

        if (historyIndex > 0) {
            historyIndex--;
            const prevUrl = videoHistory[historyIndex];
            currentUrl = prevUrl;
            video.src = prevUrl;
            video.load();
            updateFavButton();
            showToast("回到上一个");
        } else {
            showToast("已经是第一个了");
        }
    }

    // 5. 收藏
    function toggleFavorite() {
        if (!currentUrl) return;
        const idx = favorites.indexOf(currentUrl);
        if (idx > -1) {
            favorites.splice(idx, 1);
            favBtn.classList.remove('favorited');
            showToast("取消收藏");

            if (currentTab === 'favorite' && favorites.length === 0) {
                video.pause();
                video.src = '';
                emptyFav.classList.add('show');
            }
        } else {
            favorites.push(currentUrl);
            favBtn.classList.add('favorited');
            showToast("收藏成功");
        }
        saveFavorites();
    }

    // 更新收藏按钮状态
    function updateFavButton() {
        if (favorites.includes(currentUrl)) {
            favBtn.classList.add('favorited');
        } else {
            favBtn.classList.remove('favorited');
        }
    }

    function showToast(msg) {
        toast.innerHTML = msg;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    // 手势逻辑
    let startY = 0;
    let startX = 0;
    document.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
    }, { passive: true });

    document.addEventListener('touchend', e => {
        const endY = e.changedTouches[0].clientY;
        const endX = e.changedTouches[0].clientX;
        const diffY = endY - startY;
        const diffX = endX - startX;

        // 垂直滑动
        if (Math.abs(diffY) > 80 && Math.abs(diffY) > Math.abs(diffX)) {
            if (diffY < -80) nextVideo(); // 上滑
            else if (diffY > 80) prevVideo(); // 下滑
        }
    });

    // 点击视频暂停/播放
    let lastTap = 0;
    video.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < 300) {
            // 双击收藏
            toggleFavorite();
        } else {
            // 单击暂停/播放
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
        lastTap = now;
    });

    // 初始化
    loadVideo();
</script>

</body>
</html>
