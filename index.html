<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sophia视频 - 随机推荐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

        /* 顶部导航 */
        .nav-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .nav-item {
            color: rgba(255,255,255,0.6);
            padding: 6px 18px;
            font-size: 15px;
            white-space: nowrap;
            cursor: pointer;
            border-radius: 18px;
            transition: all 0.3s;
            user-select: none;
        }

        .nav-item.active {
            color: #fff;
            font-weight: 700;
            font-size: 17px;
        }

        .nav-item.active::after {
            content: '';
            display: block;
            width: 20px;
            height: 3px;
            background: #ff453a;
            border-radius: 2px;
            margin: 4px auto 0;
        }

        /* 视频容器 */
        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        video { width: 100%; height: 100%; object-fit: cover; background: #000; }

        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 50;
            display: none;
        }
        .loading.show { display: block; }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 右侧按钮 */
        .sidebar {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            z-index: 100;
        }

        .action-btn {
            width: 48px; height: 48px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 26px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s;
        }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
        .action-btn.favorited { color: #ff3b30; background: rgba(255, 59, 48, 0.15); border-color: rgba(255, 59, 48, 0.4); }

        /* 底部信息条 */
        .video-info {
            position: absolute;
            left: 15px;
            right: 70px;
            bottom: 80px;
            z-index: 100;
            color: #fff;
            pointer-events: none;
        }
        .video-info .author {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .video-info .desc {
            font-size: 13px;
            opacity: 0.85;
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 提示框 */
        #toast {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 14px 22px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 200;
            text-align: center;
            font-size: 14px;
            max-width: 70%;
        }
        #toast.show { opacity: 1; }

        /* 收藏空状态 */
        .empty-fav {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            text-align: center;
            z-index: 50;
            font-size: 14px;
            display: none;
        }
        .empty-fav.show { display: block; }
        .empty-fav .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('recommend', this)">推荐</div>
    <div class="nav-item" onclick="switchTab('favorite', this)">收藏</div>
</div>

<div id="player-container">
    <video id="video-player" playsinline webkit-playsinline></video>

    <!-- 加载动画 -->
    <div class="loading" id="loading"></div>

    <!-- 空收藏提示 -->
    <div class="empty-fav" id="empty-fav">
        <div class="icon">☆</div>
        <div>还没有收藏哦</div>
        <div style="font-size:12px;margin-top:6px;opacity:0.7;">点击右侧 ★ 按钮收藏视频</div>
    </div>

    <!-- 底部视频信息 -->
    <div class="video-info" id="video-info">
        <div class="author" id="video-author">@Sophia视频</div>
        <div class="desc" id="video-desc">随机推荐，上滑看下一个</div>
    </div>

    <!-- 右侧按钮 -->
    <div class="sidebar">
        <div class="action-btn" id="fav-btn" onclick="toggleFavorite()">★</div>
        <div class="action-btn" onclick="nextVideo()">→</div>
    </div>

    <div id="toast"></div>
</div>

<script>
    // 三个视频源，轮询使用防止卡顿
    const API_SOURCES = [
        'https://www.cunshao.com/666666/api/pc.php',
        'https://www.cunshao.com/666666/api/web.php',
        'https://api.suyanw.cn/api/jksp.php'
    ];

    const video = document.getElementById('video-player');
    const toast = document.getElementById('toast');
    const favBtn = document.getElementById('fav-btn');
    const loading = document.getElementById('loading');
    const emptyFav = document.getElementById('empty-fav');
    const videoInfo = document.getElementById('video-info');

    let currentTab = 'recommend';
    let currentUrl = '';
    let currentSourceIndex = 0;
    let videoHistory = [];
    let historyIndex = -1;
    let favorites = [];
    let favCurrentIndex = 0;

    // 从本地存储加载收藏
    try {
        const saved = localStorage.getItem('sophia_favorites');
        if (saved) favorites = JSON.parse(saved);
    } catch (e) {}

    function saveFavorites() {
        try {
            localStorage.setItem('sophia_favorites', JSON.stringify(favorites));
        } catch (e) {}
    }

    // 切换标签
    function switchTab(tab, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        currentTab = tab;
        videoHistory = [];
        historyIndex = -1;

        if (tab === 'favorite') {
            if (favorites.length === 0) {
                video.pause();
                video.src = '';
                emptyFav.classList.add('show');
                videoInfo.style.display = 'none';
                favBtn.style.display = 'none';
            } else {
                emptyFav.classList.remove('show');
                videoInfo.style.display = 'block';
                favBtn.style.display = 'flex';
                favCurrentIndex = Math.floor(Math.random() * favorites.length);
                loadFavoriteVideo(favCurrentIndex);
            }
        } else {
            emptyFav.classList.remove('show');
            videoInfo.style.display = 'block';
            favBtn.style.display = 'flex';
            loadVideo();
        }
    }

    // 获取下一个 API 源（轮询）
    function getNextApiSource() {
        const url = API_SOURCES[currentSourceIndex];
        currentSourceIndex = (currentSourceIndex + 1) % API_SOURCES.length;
        return url;
    }

    // 加载推荐视频
    async function loadVideo() {
        showLoading(true);
        video.pause();
        video.src = '';
        video.load();

        const sourceUrl = getNextApiSource();
        const url = `${sourceUrl}?t=${Date.now()}_${Math.random()}`;
        currentUrl = url;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('网络错误');

            const blob = await response.blob();
            if (blob.size < 1000) throw new Error('视频太小');

            const videoUrl = URL.createObjectURL(blob);
            video.src = videoUrl;

            // 更新收藏按钮状态
            updateFavButton();

            const playPromise = video.play();
            if (playPromise) {
                playPromise.catch(() => {
                    showToast("点击屏幕播放");
                });
            }

            video.onloadeddata = () => {
                showLoading(false);
            };

            video.onerror = () => {
                showLoading(false);
                showToast("播放失败，换下一个");
                setTimeout(() => nextVideo(), 800);
            };

        } catch (err) {
            showLoading(false);
            // 失败了就试下一个源
            if (currentSourceIndex !== 0) {
                showToast("换个源试试...");
                loadVideo();
            } else {
                showToast("加载失败，请重试");
            }
        }
    }

    // 加载收藏视频
    function loadFavoriteVideo(index) {
        if (favorites.length === 0) {
            emptyFav.classList.add('show');
            return;
        }

        showLoading(true);
        video.pause();
        video.src = '';
        video.load();

        const url = favorites[index];
        currentUrl = url;

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error();
                return res.blob();
            })
            .then(blob => {
                const videoUrl = URL.createObjectURL(blob);
                video.src = videoUrl;
                updateFavButton();
                video.play().catch(() => {});
                video.onloadeddata = () => showLoading(false);
                video.onerror = () => {
                    showLoading(false);
                    nextFavVideo();
                };
            })
            .catch(() => {
                showLoading(false);
                showToast("加载失败");
            });
    }

    // 下一个视频
    function nextVideo() {
        if (currentTab === 'favorite') {
            nextFavVideo();
            return;
        }

        historyIndex++;
        videoHistory.push(currentUrl);
        if (videoHistory.length > 20) {
            videoHistory.shift();
            historyIndex--;
        }

        loadVideo();
    }

    // 下一个收藏视频
    function nextFavVideo() {
        if (favorites.length === 0) return;
        favCurrentIndex = (favCurrentIndex + 1) % favorites.length;
        loadFavoriteVideo(favCurrentIndex);
    }

    // 上一个视频
    function prevVideo() {
        if (currentTab === 'favorite') {
            if (favorites.length === 0) return;
            favCurrentIndex = (favCurrentIndex - 1 + favorites.length) % favorites.length;
            loadFavoriteVideo(favCurrentIndex);
            return;
        }

        if (historyIndex > 0) {
            historyIndex--;
            const prevUrl = videoHistory[historyIndex];
            currentUrl = prevUrl;

            showLoading(true);
            video.pause();
            video.src = '';

            fetch(prevUrl)
                .then(res => res.blob())
                .then(blob => {
                    video.src = URL.createObjectURL(blob);
                    updateFavButton();
                    video.play().catch(() => {});
                    video.onloadeddata = () => showLoading(false);
                })
                .catch(() => {
                    showLoading(false);
                    showToast("加载失败");
                });

            showToast("回到上一个");
        } else {
            showToast("已经是第一个了");
        }
    }

    // 收藏/取消收藏
    function toggleFavorite() {
        if (!currentUrl) return;

        const idx = favorites.indexOf(currentUrl);
        if (idx > -1) {
            favorites.splice(idx, 1);
            favBtn.classList.remove('favorited');
            showToast("已取消收藏");

            // 如果在收藏页且删光了
            if (currentTab === 'favorite' && favorites.length === 0) {
                video.pause();
                video.src = '';
                emptyFav.classList.add('show');
            }
        } else {
            favorites.push(currentUrl);
            favBtn.classList.add('favorited');
            showToast("收藏成功 ♥");
        }

        saveFavorites();
    }

    // 更新收藏按钮状态
    function updateFavButton() {
        if (favorites.includes(currentUrl)) {
            favBtn.classList.add('favorited');
        } else {
            favBtn.classList.remove('favorited');
        }
    }

    // 显示/隐藏加载
    function showLoading(show) {
        if (show) loading.classList.add('show');
        else loading.classList.remove('show');
    }

    // 提示
    let toastTimer = null;
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 1800);
    }

    // 手势：上下滑切换视频
    let startY = 0;
    let startX = 0;
    let isDragging = false;

    document.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        isDragging = true;
    }, { passive: true });

    document.addEventListener('touchend', e => {
        if (!isDragging) return;
        isDragging = false;

        const endY = e.changedTouches[0].clientY;
        const endX = e.changedTouches[0].clientX;
        const diffY = endY - startY;
        const diffX = endX - startX;

        // 垂直滑动距离大于 60px 且大于水平距离
        if (Math.abs(diffY) > 60 && Math.abs(diffY) > Math.abs(diffX)) {
            if (diffY < 0) {
                nextVideo(); // 上滑 = 下一个
            } else {
                prevVideo(); // 下滑 = 上一个
            }
        }
    });

    // 点击视频区域暂停/播放
    let lastTap = 0;
    video.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTap < 300) {
            // 双击收藏
            toggleFavorite();
        } else {
            // 单击暂停/播放
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
        lastTap = now;
    });

    // 视频播放结束自动下一个
    video.addEventListener('ended', () => {
        nextVideo();
    });

    // 初始化
    loadVideo();
</script>

</body>
</html>
