<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sophia视频 - 随机推荐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* 顶部导航 */
        .nav-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .nav-item {
            color: rgba(255,255,255,0.6);
            padding: 6px 15px;
            font-size: 15px;
            white-space: nowrap;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
            user-select: none;
        }

        .nav-item.active {
            color: #fff;
            font-weight: bold;
            font-size: 17px;
        }

        .nav-item.active::after {
            content: '';
            display: block;
            width: 20px;
            height: 3px;
            background: #ff453a;
            border-radius: 2px;
            margin: 4px auto 0;
        }

        /* 视频容器 */
        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        /* 中央播放按钮 */
        .play-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 30px;
            z-index: 80;
            cursor: pointer;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .play-center.show { opacity: 1; }

        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 60;
            display: none;
        }
        .loading.show { display: block; }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 右侧按钮 */
        .sidebar {
            position: absolute;
            right: 10px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        .action-btn {
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 24px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            user-select: none;
        }
        .action-btn:active { background: rgba(255,255,255,0.2); }
        .action-btn.favorited { color: #ffd700; background: rgba(255, 215, 0, 0.2); border-color: #ffd700; }

        /* 提示框 */
        #toast {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 200;
            text-align: center;
            font-size: 14px;
            max-width: 70%;
        }
        #toast.show { opacity: 1; }

        /* 收藏空状态 */
        .empty-fav {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.5);
            text-align: center;
            z-index: 50;
            font-size: 14px;
            display: none;
        }
        .empty-fav.show { display: block; }
        .empty-fav .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('recommend', this)">推荐</div>
    <div class="nav-item" onclick="switchTab('favorite', this)">收藏</div>
</div>

<div id="player-container">
    <video id="video-player" playsinline webkit-playsinline loop preload="auto"></video>

    <!-- 中央播放按钮 -->
    <div class="play-center" id="play-center">▶</div>

    <!-- 加载动画 -->
    <div class="loading" id="loading"></div>

    <!-- 空收藏提示 -->
    <div class="empty-fav" id="empty-fav">
        <div class="icon">☆</div>
        <div>还没有收藏哦</div>
        <div style="font-size:12px;margin-top:6px;opacity:0.7;">点击右侧 ★ 按钮收藏视频</div>
    </div>

    <!-- 右侧按钮 -->
    <div class="sidebar">
        <div class="action-btn" id="fav-btn" onclick="toggleFavorite()">★</div>
        <div class="action-btn" onclick="nextVideo()">→</div>
    </div>

    <div id="toast"></div>
</div>

<script>
    // 三个视频源，同时请求，哪个快用哪个（竞速加载）
    const API_SOURCES = [
        'https://www.cunshao.com/666666/api/pc.php',
        'https://www.cunshao.com/666666/api/web.php',
        'https://api.suyanw.cn/api/jksp.php'
    ];

    const video = document.getElementById('video-player');
    const toast = document.getElementById('toast');
    const favBtn = document.getElementById('fav-btn');
    const emptyFav = document.getElementById('empty-fav');
    const loading = document.getElementById('loading');
    const playCenter = document.getElementById('play-center');

    let currentTab = 'recommend';
    let currentUrl = '';
    let videoHistory = [];
    let historyIndex = -1;
    let favorites = [];
    let favIndex = 0;
    let isLoading = false;
    let hasStarted = false; // 是否已经开始播放过（用于处理静音策略）

    // 从本地存储加载收藏
    try {
        const saved = localStorage.getItem('sophia_favorites');
        if (saved) favorites = JSON.parse(saved);
    } catch (e) {}

    function saveFavorites() {
        try {
            localStorage.setItem('sophia_favorites', JSON.stringify(favorites));
        } catch (e) {}
    }

    // 1. 切换标签
    function switchTab(tab, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        currentTab = tab;
        videoHistory = [];
        historyIndex = -1;

        if (tab === 'favorite') {
            if (favorites.length === 0) {
                video.pause();
                video.src = '';
                emptyFav.classList.add('show');
                loading.classList.remove('show');
                playCenter.classList.remove('show');
            } else {
                emptyFav.classList.remove('show');
                favIndex = Math.floor(Math.random() * favorites.length);
                loadFavoriteVideo();
            }
        } else {
            emptyFav.classList.remove('show');
            loadVideo();
        }
    }

    // 2. 加载推荐视频 —— 三源竞速，谁快用谁
    function loadVideo() {
        if (isLoading) return;
        isLoading = true;
        loading.classList.add('show');
        playCenter.classList.remove('show');

        const timestamp = new Date().getTime() + '_' + Math.random();
        let settled = false;
        let failedCount = 0;

        // 三个源同时请求
        API_SOURCES.forEach((source, idx) => {
            const url = `${source}?t=${timestamp}`;

            // 用一个临时 video 元素预加载测试
            const testVideo = document.createElement('video');
            testVideo.preload = 'auto';
            testVideo.muted = true;
            testVideo.src = url;

            const onSuccess = () => {
                if (settled) return;
                settled = true;
                isLoading = false;
                currentUrl = url;

                video.src = url;
                video.load();

                updateFavButton();
                loading.classList.remove('show');

                // 尝试播放
                const playPromise = video.play();
                if (playPromise) {
                    playPromise.then(() => {
                        hasStarted = true;
                    }).catch(() => {
                        // 自动播放失败，显示播放按钮
                        playCenter.classList.add('show');
                    });
                }
            };

            const onFail = () => {
                failedCount++;
                if (failedCount >= API_SOURCES.length && !settled) {
                    settled = true;
                    isLoading = false;
                    loading.classList.remove('show');
                    showToast("加载失败，上滑重试");
                }
            };

            testVideo.addEventListener('loadeddata', onSuccess);
            testVideo.addEventListener('error', onFail);

            // 超时 8 秒
            setTimeout(() => {
                if (!settled) {
                    testVideo.src = '';
                    onFail();
                }
            }, 8000);
        });
    }

    // 加载收藏视频
    function loadFavoriteVideo() {
        if (favorites.length === 0) {
            emptyFav.classList.add('show');
            return;
        }

        loading.classList.add('show');
        playCenter.classList.remove('show');

        const url = favorites[favIndex];
        currentUrl = url;

        video.src = url;
        video.load();

        updateFavButton();

        video.onloadeddata = function() {
            loading.classList.remove('show');
            const playPromise = video.play();
            if (playPromise) {
                playPromise.then(() => {
                    hasStarted = true;
                }).catch(() => {
                    playCenter.classList.add('show');
                });
            }
        };

        video.onerror = function() {
            loading.classList.remove('show');
            showToast("加载失败");
        };
    }

    // 3. 下一个视频 (上滑)
    function nextVideo() {
        if (currentTab === 'favorite') {
            if (favorites.length === 0) return;
            favIndex = (favIndex + 1) % favorites.length;
            loadFavoriteVideo();
            return;
        }

        videoHistory.push(currentUrl);
        if (videoHistory.length > 30) { videoHistory.shift(); }
        historyIndex = videoHistory.length - 1;
        loadVideo();
    }

    // 4. 上一个视频 (下滑)
    function prevVideo() {
        if (currentTab === 'favorite') {
            if (favorites.length === 0) return;
            favIndex = (favIndex - 1 + favorites.length) % favorites.length;
            loadFavoriteVideo();
            return;
        }

        if (historyIndex > 0) {
            historyIndex--;
            const prevUrl = videoHistory[historyIndex];
            currentUrl = prevUrl;

            loading.classList.add('show');
            video.src = prevUrl;
            video.load();
            updateFavButton();

            video.onloadeddata = function() {
                loading.classList.remove('show');
                video.play().catch(() => {
                    playCenter.classList.add('show');
                });
            };

            showToast("回到上一个");
        } else {
            showToast("已经是第一个了");
        }
    }

    // 5. 收藏
    function toggleFavorite() {
        if (!currentUrl) return;
        const idx = favorites.indexOf(currentUrl);
        if (idx > -1) {
            favorites.splice(idx, 1);
            favBtn.classList.remove('favorited');
            showToast("取消收藏");

            if (currentTab === 'favorite' && favorites.length === 0) {
                video.pause();
                video.src = '';
                emptyFav.classList.add('show');
            }
        } else {
            favorites.push(currentUrl);
            favBtn.classList.add('favorited');
            showToast("收藏成功");
        }
        saveFavorites();
    }

    // 更新收藏按钮状态
    function updateFavButton() {
        if (favorites.includes(currentUrl)) {
            favBtn.classList.add('favorited');
        } else {
            favBtn.classList.remove('favorited');
        }
    }

    function showToast(msg) {
        toast.innerHTML = msg;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    // 手势逻辑
    let startY = 0;
    let startX = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', e => {
        startY = e.touches[0].clientY;
        startX = e.touches[0].clientX;
        touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener('touchend', e => {
        const endY = e.changedTouches[0].clientY;
        const endX = e.changedTouches[0].clientX;
        const diffY = endY - startY;
        const diffX = endX - startX;
        const touchDuration = Date.now() - touchStartTime;

        // 垂直滑动（上滑/下滑切视频）
        if (Math.abs(diffY) > 60 && Math.abs(diffY) > Math.abs(diffX) && touchDuration < 500) {
            if (diffY < -60) {
                nextVideo(); // 上滑 = 下一个
            } else if (diffY > 60) {
                prevVideo(); // 下滑 = 上一个
            }
            return;
        }

        // 点击（轻触播放/暂停）
        if (Math.abs(diffY) < 10 && Math.abs(diffX) < 10 && touchDuration < 200) {
            if (video.paused) {
                playCenter.classList.remove('show');
                video.play().catch(() => {
                    showToast("点击屏幕播放");
                });
            } else {
                video.pause();
                playCenter.classList.add('show');
            }
        }
    });

    // 双击收藏
    let lastTapTime = 0;
    video.addEventListener('click', () => {
        const now = Date.now();
        if (now - lastTapTime < 300) {
            toggleFavorite();
        }
        lastTapTime = now;
    });

    // 视频播放结束自动下一个
    video.addEventListener('ended', () => {
        if (currentTab === 'recommend') {
            nextVideo();
        }
    });

    // 初始化
    loadVideo();
</script>

</body>
</html>
